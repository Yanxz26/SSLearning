server:
  port: 8080

spring:
  datasource:
    # ============================================================================
    # 数据库连接 —— 全部走环境变量，本配置不提供默认值，避免密钥进仓库
    #
    #   DB_URL       jdbc:mysql://host:3306/learning_assistant?...
    #   DB_USERNAME  数据库账号
    #   DB_PASSWORD  数据库密码（必填）
    #
    # 本地开发可在 IDE Run Configuration 或启动脚本里加：
    #   -DB_URL=jdbc:mysql://localhost:3306/learning_assistant?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    #   -DB_USERNAME=root
    #   -DB_PASSWORD=你的密码
    # ============================================================================
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 20MB

# 文件上传配置
app:
  upload:
    # 图片落盘目录（相对启动目录，也可写绝对路径覆盖）
    dir: ${UPLOAD_DIR:uploads}
    # 对外访问前缀，前端拼成 http://host:8080 + 该路径
    url-prefix: /uploads

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.app.entity
  configuration:
    map-underscore-to-camel-case: true

logging:
  level:
    com.example.app: DEBUG
    org.mybatis: DEBUG